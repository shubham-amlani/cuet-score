<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Shubham Amlani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #070708; color: #fff; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-4xl font-black tracking-tighter">DATA <span class="text-indigo-500">LABS</span></h1>
                <p class="text-slate-500 text-sm">Real-time Admission Analytics</p>
            </div>
            
            <div class="w-full md:w-auto flex flex-col md:flex-row gap-3">
                <input type="text" id="adminSearch" placeholder="Search students..." 
                    class="glass rounded-xl px-4 py-3 outline-none focus:ring-2 ring-indigo-500 w-full md:w-64">
                <select id="subjectFilter" class="glass rounded-xl px-4 py-3 outline-none">
                    <option value="ALL">All Subjects</option>
                    <option value="General Management">General Mgmt</option>
                    <option value="Computer Science and Information Technology">CS & IT</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
            <div class="glass p-6 rounded-3xl border-l-4 border-indigo-500">
                <p class="text-xs font-bold text-slate-500 uppercase">Total Entries</p>
                <h2 id="statTotal" class="text-4xl font-black mt-2">0</h2>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-green-500">
                <p class="text-xs font-bold text-slate-500 uppercase">Highest Score</p>
                <h2 id="statMax" class="text-4xl font-black mt-2 text-green-400">0</h2>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-amber-500">
                <p class="text-xs font-bold text-slate-500 uppercase">Avg Score</p>
                <h2 id="statAvg" class="text-4xl font-black mt-2 text-amber-400">0</h2>
            </div>
            <div class="glass p-6 rounded-3xl">
                <p class="text-xs font-bold text-slate-500 uppercase">IT Segment</p>
                <h2 id="statIT" class="text-4xl font-black mt-2">0</h2>
            </div>
        </div>

        <div class="glass rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white/5">
                        <tr>
                            <th class="p-5 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Candidate</th>
                            <th class="p-5 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Score</th>
                            <th class="p-5 text-slate-400 font-bold uppercase text-[10px] tracking-widest hidden md:table-cell">Subject</th>
                            <th class="p-5 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Stats</th>
                            <th class="p-5 text-slate-400 font-bold uppercase text-[10px] tracking-widest hidden lg:table-cell">Date</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-white/5">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        async function fetchAdminData() {
            const token = new URLSearchParams(window.location.search).get('token') || prompt("Admin Access Key:");
            const res = await fetch(`/api/admin-data?token=${token}`);
            rawData = await res.json();
            render();
        }

        function render() {
            const query = document.getElementById('adminSearch').value.toLowerCase();
            const filter = document.getElementById('subjectFilter').value;
            
            const filtered = rawData.filter(d => 
                (d.candidate_name.toLowerCase().includes(query) || d.application_no.includes(query)) &&
                (filter === 'ALL' || d.subject === filter)
            );

            // Update stats
            document.getElementById('statTotal').innerText = filtered.length;
            const scores = filtered.map(d => d.total_score);
            document.getElementById('statMax').innerText = scores.length ? Math.max(...scores) : 0;
            document.getElementById('statAvg').innerText = scores.length ? Math.round(scores.reduce((a,b)=>a+b)/scores.length) : 0;
            document.getElementById('statIT').innerText = filtered.filter(d => d.subject.includes("Computer")).length;

            document.getElementById('adminTableBody').innerHTML = filtered.map(d => `
                <tr class="hover:bg-white/[0.02] transition-all group">
                    <td class="p-5">
                        <div class="font-bold text-white group-hover:text-indigo-400 transition-colors">${d.candidate_name}</div>
                        <div class="text-[10px] text-slate-500">${d.application_no}</div>
                    </td>
                    <td class="p-5">
                        <span class="text-xl font-black">${d.total_score}</span>
                    </td>
                    <td class="p-5 hidden md:table-cell">
                        <span class="text-[10px] px-2 py-1 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${d.subject}</span>
                    </td>
                    <td class="p-5">
                        <div class="text-xs text-green-400 font-bold">C: ${d.total_correct}</div>
                        <div class="text-xs text-slate-500">A: ${d.total_attempted}</div>
                    </td>
                    <td class="p-5 hidden lg:table-cell text-xs text-slate-500">
                        ${new Date(d.created_at).toLocaleDateString()}
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('adminSearch').addEventListener('input', render);
        document.getElementById('subjectFilter').addEventListener('change', render);
        fetchAdminData();
    </script>
</body>
</html>
